---
name: Release / Publish

on:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-release

      - name: Restore prepared release
        run: |
          git fetch prepared-release.bundle \
            'refs/heads/prepared-release:refs/heads/prepared-release' \
            'refs/tags/*:refs/tags/*'
          git switch --detach refs/heads/prepared-release

      - name: Download release metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metrics
          path: logs

      - name: Download test coverage log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-test-coverage
          path: logs/test-coverage

      - name: Commit release metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/bundle-sizes logs/bytecode-size logs/compiler-coverage-counts logs/tsdoc-coverage logs/test-coverage
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): record release metrics" --no-verify
          fi

      - name: Push release
        run: git push origin HEAD:main --follow-tags --no-verify --atomic
