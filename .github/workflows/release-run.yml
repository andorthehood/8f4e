---
name: Release / Run

on:
  workflow_call:

permissions:
  contents: write

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD || 'true' }}

jobs:
  release:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit and tags
        run: |
          release_tags="$(git tag --list '@8f4e/*@*' 'app@*')"
          if [[ -z "$release_tags" ]]; then
            echo "No existing release tags were found. Refusing to run first-release mode from CI."
            exit 1
          fi

          npx nx release --skip-publish

      - name: Build config package
        run: npx nx run @8f4e/config:build

      - name: Build sites, collect metrics, and test
        run: |
          (
            export NX_PARALLEL=2
            npx nx run @8f4e/editor-website:build
            node scripts/log-bundle-sizes.mjs
            npx nx run @8f4e/examples:log-bytecode-size
            npx nx run @8f4e/examples:log-compiler-coverage-counts
            npx nx run @8f4e/compiler:docs-coverage
            npx nx run @8f4e/8f4e-website:build
          ) &
          build_pid=$!

          (
            npx nx run-many --target=test --all --exclude=@8f4e/editor-website,glugglugglug --parallel=2 --skip-nx-cache -- --coverage
            node scripts/log-test-coverage.mjs
          ) &
          test_pid=$!

          status=0
          wait "$build_pid" || status=$?
          wait "$test_pid" || status=$?
          exit "$status"

      - name: Commit release metrics
        run: |
          git add logs/bundle-sizes logs/bytecode-size logs/compiler-coverage-counts logs/tsdoc-coverage logs/test-coverage
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): record release metrics" --no-verify
          fi

      - name: Upload 8f4e.com
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 8f4e-website
          path: packages/8f4e-website/dist
          include-hidden-files: true
          retention-days: 1

      - name: Upload editor.8f4e.com
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-website
          path: packages/editor/packages/editor-website/dist
          include-hidden-files: true
          retention-days: 1

      - name: Push release
        run: git push origin HEAD:main --follow-tags --no-verify --atomic
