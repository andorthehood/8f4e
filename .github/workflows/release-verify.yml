---
name: Release / Verify

on:
  workflow_call:

permissions:
  contents: read

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD || 'true' }}

jobs:
  test_and_coverage:
    name: Test and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-release

      - name: Restore prepared release
        run: |
          git fetch prepared-release.bundle \
            'refs/heads/prepared-release:refs/heads/prepared-release' \
            'refs/tags/*:refs/tags/*'
          git switch --detach refs/heads/prepared-release

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: |
          npx nx run-many --target=test --all --exclude=@8f4e/editor-website,glugglugglug --parallel=2 --skip-nx-cache -- --coverage
          node scripts/log-test-coverage.mjs

      - name: Upload test coverage log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-coverage
          path: logs/test-coverage
          retention-days: 1

  build_and_metrics:
    name: Build sites and collect metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-release

      - name: Restore prepared release
        run: |
          git fetch prepared-release.bundle \
            'refs/heads/prepared-release:refs/heads/prepared-release' \
            'refs/tags/*:refs/tags/*'
          git switch --detach refs/heads/prepared-release

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build editor.8f4e.com and collect metrics
        run: |
          npx nx run @8f4e/editor-website:build
          node scripts/log-bundle-sizes.mjs
          npx nx run @8f4e/examples:log-bytecode-size
          npx nx run @8f4e/examples:log-compiler-coverage-counts
          npx nx run @8f4e/compiler:docs-coverage

      - name: Build 8f4e.com
        run: npx nx run @8f4e/8f4e-website:build

      - name: Upload release metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metrics
          path: |
            logs/bundle-sizes
            logs/bytecode-size
            logs/compiler-coverage-counts
            logs/tsdoc-coverage
          retention-days: 1

      - name: Upload 8f4e.com
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 8f4e-website
          path: packages/8f4e-website/dist
          include-hidden-files: true
          retention-days: 1

      - name: Upload editor.8f4e.com
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-website
          path: packages/editor/packages/editor-website/dist
          include-hidden-files: true
          retention-days: 1
