---
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    uses: ./.github/workflows/release-prepare.yml

  verify:
    name: Verify
    needs: prepare
    uses: ./.github/workflows/release-verify.yml

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml

  deploy:
    name: Deploy
    needs: publish
    permissions: {}
    uses: ./.github/workflows/release-deploy.yml
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
