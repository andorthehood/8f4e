---
name: Release / Prepare

on:
  workflow_call:

permissions:
  contents: read

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD || 'true' }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be run from main. Current ref: $GITHUB_REF"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit and tags
        run: |
          release_tags="$(git tag --list '@8f4e/*@*' 'app@*')"
          if [[ -z "$release_tags" ]]; then
            echo "No existing release tags were found. Refusing to run first-release mode from CI."
            exit 1
          fi

          npx nx release --skip-publish
          git branch prepared-release HEAD

          prepared_tags=()
          while IFS= read -r prepared_tag; do
            prepared_tags+=("$prepared_tag")
          done < <(git tag --points-at HEAD --format='%(refname)')

          git bundle create prepared-release.bundle \
            refs/heads/prepared-release \
            "${prepared_tags[@]}" \
            "^$GITHUB_SHA"

      - name: Upload prepared release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-release
          path: prepared-release.bundle
          retention-days: 1
